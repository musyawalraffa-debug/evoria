name: Build EVORIA Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/evoria-sanctuary-v1.0.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: evoria-release-apk
          path: build/app/outputs/flutter-apk/evoria-sanctuary-v1.0.1.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.1' }}
          name: "🌸 EVORIA Sanctuary Android v1.0.1"
          body: |
            ### ✨ EVORIA Sanctuary — Private Couple Memory Sanctuary (v1.0.1)
            Pembaruan rilis dengan perbaikan ikon navbar dan sistem tambah kenangan nyata dari galeri.
            
            #### 📱 Cara Install di HP Android:
            1. Di bagian **Assets** di bawah, klik file **`evoria-sanctuary-v1.0.1.apk`**.
            2. Setelah selesai terunduh, klik file tersebut dan pilih **Install / Pasang**.
            3. Aplikasi EVORIA Anda kini siap digunakan!
          files: |
            build/app/outputs/flutter-apk/evoria-sanctuary-v1.0.1.apk
